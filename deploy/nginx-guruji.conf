# Guruji Palmistry — nginx reverse proxy for a Hostinger VPS.
#
#   sudo cp deploy/nginx-guruji.conf /etc/nginx/sites-available/guruji
#   sudo ln -s /etc/nginx/sites-available/guruji /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gurujipalmistry.org -d www.gurujipalmistry.org
#
# certbot rewrites this file to add the TLS block and the HTTP redirect.

server {
    listen 80;
    listen [::]:80;
    server_name gurujipalmistry.org www.gurujipalmistry.org;

    # Cashfree posts here, and devotees upload palm photos
    client_max_body_size 12m;

    # Jitsi, Cashfree checkout and the chat poll all sit behind this proxy
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3456;
    }

    # The site's own files are fingerprint-free, so let the app decide caching
    location = /api/health {
        proxy_pass http://127.0.0.1:3456;
        access_log off;
    }
}
